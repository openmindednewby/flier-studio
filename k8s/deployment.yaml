# ============================================
# Flier Studio (fliers) — Deployment + Service
# ============================================
#
# SOURCE   fliers/ (static HTML/CSS/JS → nginx)
# HOST     fliers.dloizides.com
#          (add a route in personalServerNotes/k8s/ingress.yml + a TLS secret)
# IMAGE    fliers:latest (digest-pinned by manage.sh on every deploy)
# BUILD    bash personalServerNotes/scripts/manage.sh deploy fliers
#          (register in manage.sh:
#            SERVICES[fliers]="fliers:nginx.prod.dockerfile"
#            MANIFEST_PATHS[fliers]="personalServerNotes/k8s/fliers/deployment.yaml")
#
# REGISTRY: prod references 10.0.0.2:5000; manage.sh patches to localhost:5000 on staging.
#
# Single-page static frontend, single replica (32Mi/64Mi, 10m/100m).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fliers
  namespace: dloizides
  labels:
    app: fliers
    tier: web-app
    platform: portfolio
    product: fliers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fliers
  template:
    metadata:
      labels:
        app: fliers
        tier: web-app
        platform: portfolio
        product: fliers
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: fliers
          image: 10.0.0.2:5000/fliers:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: fliers
  namespace: dloizides
  labels:
    app: fliers
spec:
  type: ClusterIP
  selector:
    app: fliers
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP

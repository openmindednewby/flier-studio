server {
    listen 0.0.0.0:80;
    listen [::]:80;
    server_name  localhost;

    # HTML pages must revalidate on every visit so content/JS updates propagate
    # without users hitting stale cached HTML. Asset rules below cache longer.
    location / {
        root   /app;
        index  index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Service worker + registration snippet (pwa-sw) — never cached by the browser.
    location ~ ^/(service-worker|sw-register|sw)\.js$ {
        root /app;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
    }

    # Web app manifest — correct MIME type for install prompts.
    location = /manifest.json {
        root /app;
        types { } default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    # robots / sitemap — short cache, must revalidate.
    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        root /app;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Vite content-hashed assets — the URL changes when the bytes do.
    location /assets/ {
        root /app;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # gzip for text assets (Lighthouse perf).
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 256;
}
